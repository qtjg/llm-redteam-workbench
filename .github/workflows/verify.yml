name: Verify Redline CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Validate the CLI-only evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the CLI package
        run: pnpm install --frozen-lockfile
      - name: Validate manifests and policy
        run: pnpm validate
      - name: Run deterministic unit tests
        run: pnpm test
      - name: Format check
        run: pnpm format:check
      - name: Exercise the bounded fixture runner
        run: pnpm smoke
