name: Verify Redline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test, validate, and exercise fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
      - name: Type-check the project
        run: pnpm check
      - name: Build the optional dashboard prototype
        run: pnpm build
      - name: Verify fixture-only safety gate
        run: pnpm redline doctor
      - name: Exercise bounded evaluation fixture suite
        run: pnpm redline run --suite all --repeat 2
